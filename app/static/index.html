<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SportsSync | AI Match Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { red: '#E60000', darkred: '#CC0000', black: '#121212', gray: '#1E1E1E' } } } }
        }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #333; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-[100dvh] flex flex-col w-full md:max-w-4xl lg:max-w-5xl mx-auto relative md:border-x md:border-gray-200 dark:md:border-gray-800 shadow-2xl transition-colors duration-300 bg-gray-50 text-gray-900 dark:bg-brand-black dark:text-white overflow-hidden">
    
    <!-- Header -->
    <header class="p-4 md:p-6 bg-white dark:bg-brand-gray border-b border-gray-200 dark:border-gray-800 flex flex-col gap-4 md:gap-5 z-10 shrink-0 shadow-sm transition-colors duration-300">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-2xl md:text-3xl font-black tracking-tight"><span class="text-brand-red">Sports</span>Sync</h1>
                <div class="flex items-center gap-2 mt-1 md:mt-2 text-xs md:text-sm text-gray-500 dark:text-gray-400 font-medium">
                    <span class="relative flex h-2.5 w-2.5 md:h-3 md:w-3">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-red opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2.5 w-2.5 md:h-3 md:w-3 bg-brand-red"></span>
                    </span>
                    Live RAG Active
                </div>
            </div>
            
            <button id="theme-toggle" class="p-2.5 md:p-3 rounded-full bg-gray-100 dark:bg-black text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors">
                <svg id="icon-sun" class="w-5 h-5 md:w-6 md:h-6 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <svg id="icon-moon" class="w-5 h-5 md:w-6 md:h-6 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
        </div>

        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex gap-2 overflow-x-auto pb-1 hide-scrollbar w-full md:w-auto">
                <button data-session="f1_live" class="sport-btn px-4 py-2 rounded-full text-sm md:text-base font-bold transition-colors bg-brand-red text-white shadow-md whitespace-nowrap">🏎️ Formula 1</button>
                <button data-session="football_pl_1" class="sport-btn px-4 py-2 rounded-full text-sm md:text-base font-bold transition-colors bg-gray-100 text-gray-600 dark:bg-black dark:text-gray-300 whitespace-nowrap">⚽ Football</button>
            </div>

            <div class="flex items-center gap-3">
                <button id="btn-standings" class="px-4 py-2 rounded-lg bg-gray-900 dark:bg-white text-white dark:text-gray-900 text-sm font-bold shadow-md hover:opacity-90 transition-opacity">🏆 Standings</button>
                
                <div class="flex justify-between gap-6 items-center text-sm md:text-base font-mono bg-gray-50 dark:bg-black p-2 md:px-4 md:py-2 rounded-lg border border-gray-200 dark:border-gray-800">
                    <span class="text-gray-500 dark:text-gray-400" id="ui-label-1">Flag: <span id="ui-val-1" class="font-bold text-gray-900 dark:text-white">--</span></span>
                    <span class="text-gray-500 dark:text-gray-400" id="ui-label-2">Leader: <span id="ui-val-2" class="font-bold text-gray-900 dark:text-white">--</span></span>
                </div>
            </div>
        </div>
    </header>

    <!-- Chat Container -->
    <main id="chat-box" class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 space-y-4 md:space-y-6 pb-28 md:pb-32 flex flex-col">
        <div class="bg-white dark:bg-brand-gray border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-200 border-l-4 border-l-brand-red p-3 rounded-r-xl rounded-bl-xl self-start max-w-[85%] text-sm shadow-sm transition-colors duration-300">
            Welcome to the grandstand. The feed is active. What did you miss?
        </div>
    </main>

    <!-- Input Area -->
    <footer class="absolute bottom-0 w-full p-4 md:p-6 bg-white dark:bg-brand-gray border-t border-gray-200 dark:border-gray-800 transition-colors duration-300 z-20">
        <form id="ask-form" class="flex gap-2 relative items-center max-w-4xl mx-auto">
            <input type="text" id="query-input" autocomplete="off" required class="flex-1 bg-gray-100 dark:bg-black border border-gray-300 dark:border-gray-700 text-gray-900 dark:text-white rounded-full pl-5 pr-14 py-3 text-sm focus:outline-none focus:border-brand-red focus:ring-1 focus:ring-brand-red shadow-inner" placeholder="Ask about the match...">
            <button type="submit" class="absolute right-1.5 bg-brand-red text-white rounded-full p-2 w-10 h-10 flex items-center justify-center shadow-md"><svg class="w-4 h-4 transform rotate-90 relative left-0.5" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg></button>
        </form>
    </footer>

    <!-- Standings Modal Overlay -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex-col justify-end md:justify-center items-center pb-0 md:pb-10 transition-opacity">
        <div class="bg-white dark:bg-brand-gray w-full md:w-96 rounded-t-2xl md:rounded-2xl shadow-2xl overflow-hidden flex flex-col h-[75vh] md:h-[600px] border border-gray-200 dark:border-gray-700">
            <div class="p-4 bg-gray-50 dark:bg-black border-b border-gray-200 dark:border-gray-800 flex justify-between items-center">
                <h2 class="font-bold text-lg dark:text-white">Live Standings</h2>
                <button id="close-modal" class="text-gray-500 hover:text-gray-900 dark:hover:text-white text-2xl font-bold">&times;</button>
            </div>
            <div class="overflow-y-auto flex-1 p-0 hide-scrollbar bg-gray-50 dark:bg-brand-gray" id="standings-list">
                <!-- Data populated here -->
                <p class="p-6 text-center text-sm text-gray-500">Waiting for telemetry...</p>
            </div>
        </div>
    </div>

    <script>
        let currentSession = 'f1_live';
        let latestStandings = [];
        const chatBox = document.getElementById('chat-box');
        
        // --- Theme Toggle ---
        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // --- Sport Switcher ---
        const sportBtns = document.querySelectorAll('.sport-btn');
        sportBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                sportBtns.forEach(b => {
                    b.classList.remove('bg-brand-red', 'text-white', 'shadow-md');
                    b.classList.add('bg-gray-100', 'text-gray-600', 'dark:bg-black', 'dark:text-gray-300');
                });
                e.target.classList.remove('bg-gray-100', 'text-gray-600', 'dark:bg-black', 'dark:text-gray-300');
                e.target.classList.add('bg-brand-red', 'text-white', 'shadow-md');
                currentSession = e.target.dataset.session;
                
                chatBox.innerHTML = '';
                appendMessage(`Switched to ${e.target.innerText.replace(/[^\w\s]/g, '').trim()} feed.`, false);
                
                // Clear state UI until next poll
                latestStandings = [];
                document.getElementById('ui-val-1').textContent = '--';
                document.getElementById('ui-val-2').textContent = '--';
            });
        });

        // --- Modal Logic ---
        const modal = document.getElementById('modal-overlay');
        const standingsList = document.getElementById('standings-list');
        
        document.getElementById('btn-standings').addEventListener('click', () => {
            renderStandings();
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        });
        
        document.getElementById('close-modal').addEventListener('click', () => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        });

        function renderStandings() {
            if (latestStandings.length === 0) {
                standingsList.innerHTML = '<p class="p-6 text-center text-sm text-gray-500">Waiting for live telemetry...</p>';
                return;
            }
            standingsList.innerHTML = latestStandings.map(driver => `
                <div class="flex items-center justify-between p-4 border-b border-gray-200 dark:border-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                    <div class="flex items-center gap-4">
                        <span class="font-mono text-base font-black w-6 text-brand-red">P${driver.pos}</span>
                        <div class="flex flex-col">
                            <span class="font-bold text-sm md:text-base dark:text-white">${driver.driver}</span>
                            <span class="text-xs font-medium text-gray-500 dark:text-gray-400">${driver.team}</span>
                        </div>
                    </div>
                    
                    <!-- Points on the right-hand side -->
                    <div class="text-right ${driver.points > 0 ? 'opacity-100' : 'opacity-40'}">
                        <span class="font-black text-lg md:text-xl text-gray-900 dark:text-white">${driver.points}</span>
                        <span class="text-[10px] uppercase tracking-wider text-gray-500 block -mt-1 font-bold">PTS</span>
                    </div>
                </div>
            `).join('');
        }

        // --- Live Polling Mechanism (Every 4 seconds) ---
        async function fetchLiveState() {
            try {
                const res = await fetch(`/state/${currentSession}`);
                const data = await res.json();
                
                if (data.state) {
                    if(currentSession === 'f1_live') {
                        document.getElementById('ui-label-1').innerHTML = 'Flag: <span id="ui-val-1" class="font-bold text-gray-900 dark:text-white">' + (data.state.flags || 'Green') + '</span>';
                        document.getElementById('ui-label-2').innerHTML = 'Leader: <span id="ui-val-2" class="font-bold text-gray-900 dark:text-white">' + (data.state.leader || '--') + '</span>';
                        
                        latestStandings = data.state.standings || [];
                        // Update modal dynamically if it's open
                        if (!modal.classList.contains('hidden')) renderStandings();
                    }
                }
            } catch (err) {}
        }
        
        setInterval(fetchLiveState, 4000);
        fetchLiveState(); // Initial call

        // --- Chat Logic ---
        function appendMessage(text, isUser) {
            const div = document.createElement('div');
            if (isUser) {
                div.className = `bg-brand-red text-white p-3 rounded-l-xl rounded-br-xl self-end max-w-[85%] text-sm shadow-md`;
            } else {
                div.className = `bg-white dark:bg-brand-gray border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-200 border-l-4 border-l-brand-red p-3 rounded-r-xl rounded-bl-xl self-start max-w-[85%] text-sm shadow-sm`;
            }
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
        }

        document.getElementById('ask-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('query-input');
            const question = input.value.trim();
            if (!question) return;

            appendMessage(question, true);
            input.value = '';
            
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typing-indicator';
            typingDiv.className = 'text-xs text-gray-500 dark:text-gray-400 self-start italic ml-2';
            typingDiv.textContent = 'AI is analyzing live data...';
            chatBox.appendChild(typingDiv);
            chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question, session_id: currentSession })
                });
                document.getElementById('typing-indicator')?.remove();
                const data = await response.json();
                appendMessage(data.answer, false);
            } catch (err) {
                document.getElementById('typing-indicator')?.remove();
                appendMessage("Connection lost to the AI service.", false);
            }
        });
    </script>
</body>
</html>
